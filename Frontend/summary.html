<!DOCTYPE html>
<html>
<head>
<title>Booking Summary</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 style="text-align:center">Booking Summary</h1>

<div class="details-box">

  <p><b>Car:</b> <span id="sCar"></span></p>
  <p><b>From:</b> <span id="sFrom"></span></p>
  <p><b>To:</b> <span id="sTo"></span></p>
  <p><b>Total Days:</b> <span id="sDays"></span></p>
  <p><b>Price / Day:</b> ₹<span id="sPrice"></span></p>
  <hr>
  <h2>Total Amount: ₹<span id="sTotal"></span></h2>

  <button onclick="goPayment()">Continue to Payment</button>

</div>

<script src="script.js"></script>
</body>
</html>
